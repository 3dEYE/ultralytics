# Ultralytics YOLO27 object detection model with P3/8 - P5/32 outputs
# Same topology as YOLO26 but with the full backbone wrapped as a single
# YOLO26Backbone block (suitable for backbone pretraining workflows, e.g.
# Open Images V7 -> COCO transfer).
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 80 # number of classes
end2end: False # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants, i.e. 'model=yolo27n.yaml' will call yolo27.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO27 backbone - full YOLO26 backbone as a single block emitting [P3, P4, P5]
backbone:
  # [from, repeats, module, args]                args: [c2_nominal, use_scdown, multi_scale]
  - [-1, 1, YOLO26Backbone, [1024, True, True]]  # 0: (P3, P4, P5) with SCDown on P4/P5
  - [-1, 1, Index, [512, 0]]                     # 1: P3/8   (512 ch nominal)
  - [-2, 1, Index, [512, 1]]                     # 2: P4/16  (512 ch nominal)
  - [-3, 1, Index, [1024, 2]]                    # 3: P5/32  (1024 ch nominal)

# YOLO27 head - mirrors yolo26 FPN/PAN
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 6

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 1], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 9 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 6], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, True]] # 12 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 3], 1, Concat, [1]] # cat backbone P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 15 (P5/32-large)

  - [[9, 12, 15], 1, Detect, [nc]] # Detect(P3, P4, P5)
