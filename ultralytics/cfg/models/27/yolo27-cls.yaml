# Ultralytics YOLO27-cls image classification model
# Uses the full YOLO26 backbone wrapped as a single block (YOLO26Backbone),
# intended for backbone pretraining (e.g. on Open Images V7) before transferring
# weights to a detection model on COCO.
# Task docs: https://docs.ultralytics.com/tasks/classify

# Parameters
nc: 1000 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo27n-cls.yaml' will call yolo27-cls.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO27-cls backbone (full YOLO26 backbone as a single block)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, YOLO26Backbone, [1024]] # 0 - YOLO26 backbone (P1/2 -> P5/32)

# YOLO27-cls head
head:
  - [-1, 1, Classify, [nc]] # Classify
